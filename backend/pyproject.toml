[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "hexpanel-backend"
version = "1.0.0"
description = "Backend para HexPanel"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "argon2-cffi>=23.1.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "slowapi>=0.1.9",
    "psutil>=6.0.0",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
